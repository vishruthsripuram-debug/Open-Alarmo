; ==========================================================
;  Nintendo-Alarmo-style ESP32 Alarm Clock
;  PlatformIO project file
; ==========================================================
[env:esp32dev]
; Pinned deliberately: newer espressif32 platform releases pull in
; Arduino-ESP32 core 3.x, which replaced the ledcSetup/ledcAttachPin/
; ledcWriteTone API this firmware uses with a different one. 6.9.0 still
; ships the classic core (2.0.x) where that API works as written.
platform  = espressif32@6.9.0
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/RTClib @ ^2.1.4

; ---- TFT_eSPI is configured entirely via build_flags so you
;      never have to edit files inside the library folder. ----
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
